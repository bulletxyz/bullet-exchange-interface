name: Publish snapshot

# Keep this path stable: crates.io trusted publishing is bound to it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kind:
        required: true
        type: string
      version:
        required: true
        type: string
      commit:
        required: true
        type: string

concurrency:
  group: publish-interface
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout exact snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Validate trusted direct snapshot
        id: snapshot
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 .github/scripts/publish_snapshot.py validate-trigger \
            --kind interface \
            --event "$GITHUB_EVENT_PATH" \
            --sha "${{ inputs.commit || github.sha }}" \
            --actor "$GITHUB_ACTOR" \
            --ref "$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --version-input "${{ inputs.version }}" \
            --output "$GITHUB_OUTPUT"

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1

      - name: Test exact crate
        env:
          VERSION: ${{ steps.snapshot.outputs.version }}
        run: |
          set -euo pipefail
          cargo generate-lockfile
          test "$(git status --porcelain --untracked-files=all)" = "?? Cargo.lock"
          test "$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bullet-exchange-interface") | .version')" = "$VERSION"
          cargo test --locked --all-features
          cargo publish --locked --allow-dirty --dry-run

      - name: Check existing crate
        id: crate
        run: |
          python3 .github/scripts/publish_snapshot.py crate-status \
            --crate bullet-exchange-interface \
            --version "${{ steps.snapshot.outputs.version }}" \
            --commit "${{ steps.snapshot.outputs.commit }}" \
            --output "$GITHUB_OUTPUT"

      - name: Authenticate with crates.io
        if: steps.crate.outputs.exists != 'true'
        id: cargo-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish exact crate
        if: steps.crate.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cargo-auth.outputs.token }}
        run: cargo publish --locked --allow-dirty

      - name: Prove crate provenance
        run: |
          python3 .github/scripts/publish_snapshot.py retry-status \
            --artifact crate \
            --crate bullet-exchange-interface \
            --version "${{ steps.snapshot.outputs.version }}" \
            --commit "${{ steps.snapshot.outputs.commit }}"

      - name: Create exact tag and GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 .github/scripts/publish_snapshot.py finalize-release \
            --version "${{ steps.snapshot.outputs.version }}" \
            --commit "${{ steps.snapshot.outputs.commit }}" \
            --repository "$GITHUB_REPOSITORY"
